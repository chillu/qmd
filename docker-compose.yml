services:
  qmd:
    build:
      context: ./qmd
      dockerfile: Dockerfile
    container_name: qmd-server
    volumes:
      # Mount Obsidian vault (read/write)
      - "${VAULT_PATH}:/vault"
      # Persistent cache for QMD index
      - qmd-cache:/root/.cache/qmd
      # User-specific collection configuration (from repo root)
      - "./config.json:/config.json:ro"
    environment:
      - QMD_OPENAI=1
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - QMD_CONFIG_PATH=/config.json
    env_file:
      - .env
    ports:
      # Expose on localhost - Tailscale serve will proxy from tailnet
      - "127.0.0.1:8181:8181"
    restart: unless-stopped
    working_dir: /vault
    stdin_open: true
    tty: true
    # Internal network for MCP connector communication
    networks:
      - mcp-network

  mcpvault:
    build:
      context: ./mcpvault
      dockerfile: Dockerfile
    container_name: mcpvault-server
    volumes:
      # Mount Obsidian vault (read/write)
      - "${VAULT_PATH}:/vault"
    environment:
      - VAULT_PATH=/vault
      - MCPVAULT_PORT=8182
    env_file:
      - .env
    ports:
      # Expose on localhost - Tailscale serve will proxy from tailnet
      - "127.0.0.1:8182:8182"
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Internal network for MCP connector communication
    networks:
      - mcp-network

  # TypingMind MCP Connector - Isolated bridge to your MCP servers
  # This runs the TypingMind connector code in Docker isolation
  # so it never runs directly on your host machine
  mcp-connector:
    build:
      context: ./mcp-connector
      dockerfile: Dockerfile
    container_name: typingmind-mcp-connector
    environment:
      # Optional: Set your own auth token here, or one will be generated
      # MCP_AUTH_TOKEN: your-secure-token-here
      - PORT=50880
    ports:
      # Expose on localhost - Tailscale serve will proxy from tailnet
      # This ensures services are NOT exposed on local network
      - "127.0.0.1:50880:50880"
    restart: unless-stopped
    depends_on:
      - qmd
      - mcpvault
    networks:
      - mcp-network
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50880/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    driver: bridge
    internal: false

volumes:
  qmd-cache:
    driver: local
