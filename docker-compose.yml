services:
  qmd:
    build:
      context: ./qmd
      dockerfile: Dockerfile
    container_name: qmd-server
    volumes:
      # Mount Obsidian vault (read/write)
      - "/path/to/your/vault:/vault"
      # Persistent cache for QMD index
      - qmd-cache:/root/.cache/qmd
    environment:
      - QMD_OPENAI=1
      - OPENAI_BASE_URL=https://api.openai.com/v1
    env_file:
      - .env
    ports:
      # Bind ONLY to localhost for Tailscale serve security
      # Services are NOT exposed on local network - only via Tailscale
      - "127.0.0.1:8181:8181"
    restart: unless-stopped
    working_dir: /vault
    stdin_open: true
    tty: true

  mcpvault:
    build:
      context: ./mcpvault
      dockerfile: Dockerfile
    container_name: mcpvault-server
    volumes:
      # Mount Obsidian vault (read/write)
      - "/path/to/your/vault:/vault"
    environment:
      - VAULT_PATH=/vault
      - MCPVAULT_PORT=8182
    env_file:
      - .env
    ports:
      # Bind ONLY to localhost for Tailscale serve security
      # Services are NOT exposed on local network - only via Tailscale
      - "127.0.0.1:8182:8182"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  qmd-cache:
    driver: local
