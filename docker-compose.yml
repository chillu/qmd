services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-servers
    volumes:
      # Mount Obsidian vault for both QMD and MCPVault (read/write)
      - "/path/to/your/vault:/vault"
      # Persistent cache for QMD index
      - qmd-cache:/root/.cache/qmd
    environment:
      # QMD settings
      - QMD_OPENAI=1
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - PATH=/app/bin:/usr/local/bin:/usr/bin:/bin
      # MCPVault settings
      - VAULT_PATH=/vault
      - MCPVAULT_PORT=8182
    env_file:
      - .env
    ports:
      - "8181:8181"  # QMD MCP server
      - "8182:8182"  # MCPVault server
    working_dir: /vault
    # Keep container running and allow interactive access
    stdin_open: true
    tty: true

volumes:
  qmd-cache:
    driver: local
